name: Build EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build EXE
        run: |
          pyinstaller --onefile --console --name DocumentOCR main.py
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DocumentOCR-exe
          path: dist/DocumentOCR.exe
          retention-days: 30

name: Build EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      
      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --name DocumentOCR main.py
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/DocumentOCR.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
